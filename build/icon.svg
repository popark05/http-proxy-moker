<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1f2e"/>
      <stop offset="1" stop-color="#0e1119"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3454d1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0e1119" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- rounded app tile -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="512" height="512" rx="115" fill="url(#accent)"/>
  <rect x="1" y="1" width="510" height="510" rx="114" fill="none" stroke="#333a4d" stroke-width="2"/>

  <!-- E2 converge node, centered -->
  <g transform="translate(256,256)" stroke-linecap="round">
    <!-- top-left endpoint -> center -->
    <circle cx="-120" cy="-92" r="21" fill="#eef1f5"/>
    <line x1="-102" y1="-78" x2="-38" y2="-24" stroke="#eef1f5" stroke-width="22"/>
    <!-- bottom-left endpoint -> center -->
    <circle cx="-120" cy="92" r="21" fill="#eef1f5"/>
    <line x1="-102" y1="78" x2="-38" y2="24" stroke="#eef1f5" stroke-width="22"/>
    <!-- center intercept node -->
    <circle cx="0" cy="0" r="42" fill="#0e1119" stroke="#eef1f5" stroke-width="24"/>
    <!-- center -> right endpoint -->
    <line x1="42" y1="0" x2="112" y2="0" stroke="#eef1f5" stroke-width="22"/>
    <circle cx="132" cy="0" r="21" fill="#6284fa"/>
  </g>
</svg>
